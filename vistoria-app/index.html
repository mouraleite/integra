<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#105436">
  <title>Vistorias · Moura Leite</title>
  <link rel="manifest" href="/vistoria-app/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/vistoria-app/icone-192.png">
  <link rel="apple-touch-icon" href="/vistoria-app/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vistorias">
  <style>
    :root { --verde: #105436; --verde2: #1b8253; --claro: #e7f6ee; --texto: #0f172a; --suave: #64748b; --borda: #e2e8f0; --fundo: #f4f7f5; --laranja: #d97706; --roxo: #7c3aed; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fundo); color: var(--texto); font-family: "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    header { position: sticky; top: 0; z-index: 5; background: var(--verde); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 12px; }
    header img { width: 34px; height: 34px; border-radius: 50%; background: #fff; object-fit: contain; padding: 3px; }
    header .tit { flex: 1; min-width: 0; }
    header .tit b { display: block; font-size: 1.05rem; }
    header .tit span { display: block; font-size: 0.78rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header button { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 8px; height: 34px; padding: 0 10px; font-weight: 600; font-size: 0.8rem; }
    main { padding: 14px 16px 40px; max-width: 640px; margin: 0 auto; }
    .abas { display: flex; gap: 8px; margin-bottom: 12px; }
    .abas button { flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--borda); background: #fff; color: var(--texto); font-weight: 700; font-size: 0.92rem; }
    .abas button.on { background: var(--verde); border-color: var(--verde); color: #fff; }
    .abas .qtd { display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px; border-radius: 999px; background: rgba(0,0,0,.08); font-size: 0.78rem; }
    .abas button.on .qtd { background: rgba(255,255,255,.22); }
    .barra { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 10px; color: var(--suave); font-size: 0.8rem; }
    .barra button { background: #fff; border: 1px solid var(--borda); border-radius: 8px; height: 32px; padding: 0 10px; font-weight: 600; color: var(--verde); }
    .grupo { margin: 16px 2px 6px; font-size: 0.75rem; font-weight: 800; color: var(--verde); text-transform: uppercase; letter-spacing: 0.03em; }
    .card { background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .card .lote { font-weight: 800; font-size: 1rem; }
    .card .emp { color: var(--suave); font-size: 0.85rem; margin-top: 2px; }
    .card .info { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
    .card .quando { color: var(--suave); font-size: 0.78rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--verde); color: #fff; font-weight: 700; font-size: 0.92rem; text-decoration: none; }
    .btn.grande { width: 100%; height: 48px; font-size: 1rem; }
    .selo { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .selo.validacao { background: #ede9fe; color: var(--roxo); }
    .selo.ok { background: var(--claro); color: var(--verde); }
    .vazio, .aviso { text-align: center; color: var(--suave); padding: 36px 12px; font-size: 0.92rem; }
    .aviso b { color: var(--texto); display: block; margin-bottom: 6px; font-size: 1rem; }
    .entrar { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 20px; }
    .entrar img { width: 120px; }
    .entrar h1 { color: var(--verde); font-size: 1.35rem; margin: 14px 0 6px; }
    .entrar p { color: var(--suave); margin: 0 0 22px; }
    .erro { color: #b91c1c; font-size: 0.85rem; margin-top: 14px; white-space: pre-wrap; }
    .carregando { text-align: center; padding: 40px 0; color: var(--suave); }
    .giro { width: 28px; height: 28px; border: 3px solid var(--claro); border-top-color: var(--verde2); border-radius: 50%; margin: 0 auto 10px; animation: g 0.8s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="raiz"><div class="carregando"><div class="giro"></div>Carregando…</div></div>

  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  <script type="module" src="/js/nucleo/firebase-config.js"></script>
  <script src="/vistoria-app/app.js"></script>
</body>
</html>
